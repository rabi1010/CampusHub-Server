# Server
server.port=8080

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Neon pooler connections can reuse PostgreSQL server-side prepared metadata
# statements after Hibernate changes the schema. Disable them for schema checks.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
# Allow the request to reach the controller, which applies the 2 MB image rule.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.access.expiration=86400000
jwt.refresh.expiration=604800000

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=rabic896@gmail.com
spring.mail.password=qpfkcueazjfzrtjk
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# App
app.frontend.url=http://localhost:5173
